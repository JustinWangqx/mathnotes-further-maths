name: Check and publish MathNotes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Commit or tag to publish. Use before-study-refinement-2026-11-05 to restore the previous design.'
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      BASE_PATH: /mathnotes-further-maths/
      SITE_URL: https://justinwangqx.github.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.sha }}
          fetch-depth: 0
      - name: Record the version being published
        run: |
          git rev-parse HEAD > deployment-revision.txt
          echo 'Published source commit:' >> "$GITHUB_STEP_SUMMARY"
          cat deployment-revision.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
